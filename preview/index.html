<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2754">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portal">
<title>Portal do Colaborador</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310243e'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EPC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2754;--navy-3:#2a3c80;--accent:#33479a;--accent-dark:#263778;--accent-soft:#e9ecf7;
  --ink:#16202c;--ink-2:#4a5a6e;--ink-3:#7c8a9c;--line:#e3e8ef;--bg:#f4f6fa;
  --green:#0f9960;--green-soft:#e7f7ef;--amber:#a96b12;--amber-soft:#fdf5e3;--red:#c5342b;--red-soft:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#dfe5ee;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

/* Moldura: no celular ocupa a tela toda; no computador vira uma coluna estreita */
#phone{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:520px){#phone{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(16,36,62,.15)}}

/* ---------- LOGIN ---------- */
#login{flex:1;display:flex;flex-direction:column}
.login-top{background:linear-gradient(155deg,#1b2754 0%,#2a3c80 60%,#33479a 100%);color:#fff;padding:44px 24px 64px;position:relative;overflow:hidden}
.login-top:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06);right:-90px;top:-80px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.login-logo{height:56px;width:auto;border-radius:8px;flex:none}
.login-top h1{font-size:26px;line-height:1.2;letter-spacing:-.6px;margin-top:28px}
.login-top p{color:rgba(255,255,255,.72);margin-top:8px;font-size:14px}
.login-card{background:#fff;margin:-36px 16px 0;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(16,36,62,.1);position:relative}
.tabs{display:flex;background:#eef1f6;border-radius:10px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,36,62,.12)}
.demo{margin:16px;padding:13px 15px;background:var(--accent-soft);border-radius:12px;font-size:13px;color:#1a4f9e}
.demo b{font-weight:600}

/* ---------- FORM ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:500;font-size:13px;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-size:13px;margin:-4px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:var(--accent-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{border:1px solid var(--line);background:#fff}
.btn-danger{border:1px solid #f3c4c0;background:#fff;color:var(--red)}
.btn-sm{padding:8px 12px;font-size:13.5px;border-radius:9px;width:auto}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- APP ---------- */
#app{flex:1;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:16px 18px 18px;position:sticky;top:0;z-index:5}
.top-row{display:flex;align-items:center;gap:10px}
.top .sub{font-size:12.5px;color:rgba(255,255,255,.6)}
.top h2{font-size:19px;letter-spacing:-.3px}
.top .role{margin-left:auto;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px}
.view{flex:1;padding:16px 14px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 16px 0;display:flex;align-items:center;gap:8px}
.card-h h3{font-size:15px}
.card-h .r{margin-left:auto}
.card-b{padding:14px 16px 16px}
.muted{color:var(--ink-3);font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #f1f4f8;font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.kv span:last-child{font-weight:500;text-align:right;word-break:break-word}
.tag{display:inline-flex;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-warn{background:var(--amber-soft);color:var(--amber)}
.t-info{background:var(--accent-soft);color:var(--accent-dark)}
.t-neutral{background:#eef1f6;color:var(--ink-2)}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 14px}
.mk{background:#f1f4f8;border-radius:10px;padding:8px 4px;text-align:center}
.mk small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:500}
.mk b{font-size:14.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.mk.done{background:var(--green-soft)}.mk.done b{color:var(--green)}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #f1f4f8;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:#f7f9fc}
.item .t{font-weight:600;font-size:14.5px}
.item .d{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.item .chev{margin-left:auto;color:var(--ink-3);flex:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.aviso{padding:13px 16px;border-bottom:1px solid #f1f4f8}
.aviso:last-child{border-bottom:0}
.aviso .t{font-weight:600}
.aviso .x{font-size:14px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.aviso .d{font-size:12px;color:var(--ink-3);margin-top:5px}
.srch{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin-bottom:12px;background:#fff}
.fab{position:fixed;bottom:84px;right:max(16px,calc(50% - 224px));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(47,125,246,.4);z-index:6}
.day{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f1f4f8;font-variant-numeric:tabular-nums;font-size:14px}
.day:last-child{border-bottom:0}
.day .dt{width:58px;flex:none}
.day .dt b{display:block}
.day .dt small{color:var(--ink-3);font-size:11.5px}
.day .hs{flex:1;color:var(--ink-2);font-size:13px}
.day .tot{font-weight:600}
.line{display:grid;grid-template-columns:1fr 104px 34px;gap:6px;margin-bottom:8px;align-items:center}
.line input,.line select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#fff}
.line button{color:var(--ink-3);height:40px}
.tot-row{display:flex;justify-content:space-between;padding:12px 0;font-weight:700;font-size:16px;border-top:2px solid var(--ink);margin-top:4px}

/* Barra inferior */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:7}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:500;color:var(--ink-3);border-radius:10px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px}

/* Painel deslizante (bottom sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(16,36,62,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet.sheet-larga{max-width:980px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:16.5px}
.sheet-h button{margin-left:auto;padding:6px;color:var(--ink-3)}
.sheet-b{padding:16px;overflow-y:auto}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:500;z-index:40;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin:6px 4px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:gira .8s linear infinite;margin:0 auto 10px}
@keyframes gira{to{transform:rotate(360deg)}}
.cx-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.cx-av{width:52px;height:52px;font-size:17px}
.cx-nome{font-size:19px;font-weight:700;line-height:1.2}
.cx-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cx-edit{margin-left:auto}
.cx-mes{margin-bottom:12px}
.cx-grid{display:grid;gap:12px}
.cx-card{margin:0}
.cx-t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:10px;flex-wrap:wrap}
.cx-kpi{grid-template-columns:repeat(3,1fr)!important;margin:0 0 8px!important;padding:0!important}
.cx-linha{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid #f1f4f8}
.cx-linha span{color:var(--ink-2)}.cx-linha b{font-weight:600;text-align:right}
.cx-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cx-liq{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.cx-liq small{display:block;color:var(--ink-2);font-size:12px}.cx-liq b{font-size:24px;color:var(--accent-dark)}
.cx-sub{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.cx-mini{display:flex;justify-content:space-between;width:100%;padding:9px 2px;border:0;border-top:1px solid #f1f4f8;background:none;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.cx-mini i{font-style:normal;margin-left:4px}.cx-mini .ok{color:var(--green)}.cx-mini .pend{color:var(--amber)}
@media(min-width:900px){.cx-grid{grid-template-columns:1fr 1fr}}
.codigo{font-size:30px;font-weight:700;letter-spacing:6px;text-align:center;background:var(--accent-soft);color:var(--accent-dark);border-radius:12px;padding:14px;margin:10px 0;font-variant-numeric:tabular-nums;user-select:all}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px;padding:6px 0}
.ok-msg{color:var(--green);font-size:13px;margin:-4px 0 12px}

/* ---------- FOLHA DE PONTO (documento) ---------- */
.doc-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.fp-head{background:#2d4a9c;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px}
.fp-head img{max-height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:4px;padding:2px 4px}
.fp-head .ttl{flex:1;text-align:center;font-weight:700;font-size:15px;letter-spacing:.3px}
.fp-sub{background:#e4e8f3;color:#2d4a9c;font-size:11px;font-weight:600;text-align:right;padding:4px 12px}
.fp-info{display:grid;grid-template-columns:1fr;gap:0;padding:8px 12px;font-size:12px}
.fp-info div{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #2d4a9c22}
.fp-info b{flex:0 0 46%;font-weight:600;color:var(--ink)}
.fp-info span{color:#2d4a9c}
.fp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
table.fp{border-collapse:collapse;font-size:11.5px;min-width:960px;width:100%;font-variant-numeric:tabular-nums}
table.fp th{background:#2d4a9c;color:#fff;font-weight:600;padding:6px 5px;border:1px solid #fff3;text-align:center;line-height:1.2}
table.fp td{padding:4px 5px;border:1px solid #d9deea;text-align:center;white-space:nowrap}
table.fp td.l{text-align:left}
table.fp tr.cinza td{background:#eceef3}
table.fp td.hr{color:#2d4a9c}
table.fp td.ex{color:#0f9960}
table.fp td.at{color:var(--red)}
table.fp td.ob{color:#2d4a9c;text-align:left}
table.fp tr.tot td{background:#dfe4f1;color:#2d4a9c;font-weight:700;border-top:2px solid #2d4a9c}
table.fp th:first-child,table.fp td:first-child{position:sticky;left:0;z-index:1}
table.fp td:first-child{background:#fff}
table.fp tr.cinza td:first-child{background:#eceef3}
table.fp tr.tot td:first-child{background:#dfe4f1}
.fp-bl{padding:12px}
.calc-nota{background:#eef6ee;border:1px solid #cfe6cf;color:#245a2a;border-radius:10px;padding:10px 12px;font-size:13px;margin:4px 0 10px}
.fp-bl h4{color:#2d4a9c;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 6px}
table.mini{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.mini th{background:#2d4a9c;color:#fff;font-weight:600;padding:5px 6px;text-align:center}
table.mini td{padding:5px 6px;border-bottom:1px solid #d9deea}
table.mini td.n{text-align:right}
table.mini td.g{color:#0f9960;text-align:right}
table.mini tr.tot td{background:#dfe4f1;color:#2d4a9c;font-weight:700}
.pad-wrap{position:relative;background:#fff;border:1.5px dashed #b9c2dc;border-radius:12px}
.pad{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.pad-linha{position:absolute;left:16px;right:16px;bottom:34px;border-top:1px solid #c9d0e4;font-size:11px;color:#8b94ad;padding-top:3px;pointer-events:none}
.pad-limpar{position:absolute;right:10px;top:6px;font-size:13px}
.selo{display:flex;flex-direction:column;align-items:center;padding:14px 12px 0;text-align:center}
.selo img{max-height:70px;max-width:240px}
.hol .selo{font-family:Arial,sans-serif;padding-bottom:10px}
.selo-t{font-size:10.5px;color:#2d7a4a;margin-top:2px;line-height:1.35;max-width:560px}
.assin{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:26px 12px 14px;font-size:11px;color:var(--ink-2);text-align:center}
.assin div{border-top:1px solid var(--ink-2);padding-top:4px}
.hint{font-size:12px;color:var(--ink-3);padding:6px 12px;display:flex;gap:6px;align-items:center}

/* ---------- HOLERITE (recibo) ---------- */
.hol{font-family:"Courier New",ui-monospace,monospace;color:#111;background:#fff;border:1px solid #333;font-size:clamp(9.5px,2.75vw,12.5px);line-height:1.35}
.hol .lb{font-family:Arial,sans-serif;font-size:.62em;color:#333;display:block;line-height:1.1}
.hol .hb{padding:6px 8px;border-bottom:1px solid #333}
.hol .r{display:flex;justify-content:space-between;gap:8px}
.hol .r > div{min-width:0}
.hol .hb:first-child{font-size:.88em}
.hol .nw{white-space:nowrap}
.hol table{width:100%;border-collapse:collapse;table-layout:fixed}
.hol th{font-family:Arial,sans-serif;font-weight:400;font-size:.82em;border:1px solid #333;border-top:0;padding:2px 3px}
.hol td{padding:1px 4px;border-left:1px solid #333;border-right:1px solid #333;vertical-align:top;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hol td.n{text-align:right}
.hol tr.fill td{height:110px}
.hol .tt{display:grid;grid-template-columns:1fr 23% 23%;border-top:1px solid #333}
.hol .tt > div{border-left:1px solid #333;padding:3px 5px;text-align:right}
.hol .tt > div:first-child{border-left:0}
.hol .liq{display:grid;grid-template-columns:1fr 23% 23%;border-top:1px solid #333}
.hol .liq > div{padding:4px 5px;text-align:right}
.hol .liq .seta{border-left:1px solid #333;font-family:Arial,sans-serif;font-size:.8em;display:flex;align-items:center;justify-content:space-between}
.hol .liq .vl{border-left:1px solid #333;font-weight:700}
.hol .rod{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #333}
.hol .rod > div{padding:3px 5px;text-align:center;border-left:1px solid #333}
.hol .rod > div:nth-child(3n+1){border-left:0}
.hol .rod > div:nth-child(n+4){border-top:1px solid #333}
.hol .decl{font-family:Arial,sans-serif;font-size:.75em;padding:8px;border-top:1px solid #333;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- EDITORES DO RH ---------- */
.ed-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
table.ed{border-collapse:separate;border-spacing:0;font-size:14px;min-width:640px;width:100%}
table.ed th,table.ed td{border-bottom:1px solid #e6e9f2;padding:3px}
table.ed thead th{background:#2d4a9c;color:#fff;font-weight:600;font-size:12.5px;padding:7px 4px;position:sticky;top:0;z-index:2}
table.ed tbody th{text-align:left;font-weight:600;white-space:nowrap;padding:4px 8px 4px 4px;position:sticky;left:0;background:#fff;z-index:1;font-size:13px}
table.ed tbody th small{display:block;font-weight:500;color:var(--ink-3);font-size:11px}
table.ed tr.cinza th,table.ed tr.cinza td{background:#f1f3f8}
table.ed input,table.ed select{width:100%;min-width:62px;padding:7px 3px;border:1px solid #d9deea;border-radius:7px;font-size:15px;text-align:center;background:#fff;font-variant-numeric:tabular-nums}
table.ed select{min-width:110px;font-size:13.5px}
table.ed .obs-in{min-width:150px;text-align:left;padding-left:6px;font-size:13.5px}
table.ed input:focus,table.ed select:focus{outline:2px solid var(--accent);border-color:transparent}
.dl-r .nt{display:block;font-size:11px;color:#5a4bb7}
.dia-ed{border-bottom:1px solid #eef1f6;padding:8px 0}
.dia-ed.cinza{background:#f6f7fa;margin:0 -16px;padding:8px 16px}
.dia-ed .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.dia-ed .h small{color:var(--ink-3);font-weight:500}
.dia-ed .h .tag{margin-left:auto}
.t4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
